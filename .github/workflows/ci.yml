name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend lint & test ────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronolegal
          POSTGRES_PASSWORD: chronolegal
          POSTGRES_DB: chronolegal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (black)
        run: black --check app/ tests/

      - name: Lint (isort)
        run: isort --check-only --profile black app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=100 --ignore=E203,W503

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://chronolegal:chronolegal@localhost:5432/chronolegal_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_PROVIDER: ollama
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Frontend lint & build ──────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_WS_BASE_URL: ws://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (loaded locally)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: chronolegal-frontend:build-check
          build-args: |
            VITE_API_BASE_URL=https://ci-build-check.invalid/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vite inlines import.meta.env.VITE_* at build time. Without a matching
      # ARG in frontend/Dockerfile, Docker silently drops build-args it
      # doesn't declare, and the bundle falls back to the http://localhost:8000
      # default baked into the frontend code — breaking every real user's
      # browser in production while every prior check (build succeeds, lint
      # passes, type-check passes) stays green. This proves the build-arg
      # actually reaches the compiled bundle, not just that the Dockerfile
      # declares it.
      - name: Verify VITE_API_BASE_URL build-arg reaches the compiled bundle
        run: |
          docker run --rm --entrypoint sh chronolegal-frontend:build-check -c \
            "grep -rl 'ci-build-check.invalid' /usr/share/nginx/html/assets/" \
            || (echo "VITE_API_BASE_URL build-arg did not reach the built bundle" && exit 1)
          if docker run --rm --entrypoint sh chronolegal-frontend:build-check -c \
              "grep -rl 'localhost:8000' /usr/share/nginx/html/assets/ 2>/dev/null"; then
            echo "Bundle still contains the localhost:8000 fallback — build-arg wiring is broken"
            exit 1
          fi

      # Proves the production image actually boots and serves — not just
      # that `docker build` succeeds.
      - name: Boot frontend image and verify it serves the SPA
        run: |
          docker run -d --name chronolegal-frontend-smoke -p 8080:80 chronolegal-frontend:build-check
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Frontend serving after $((i))s"
              curl -s http://localhost:8080/ | grep -qi "<div id=\"root\"" \
                || (echo "Response did not contain the expected SPA root element" && exit 1)
              exit 0
            fi
            sleep 1
          done
          echo "Frontend never started serving within 10s"
          docker logs chronolegal-frontend-smoke
          exit 1

      - name: Tear down frontend smoke container
        if: always()
        run: |
          docker stop chronolegal-frontend-smoke || true
          docker rm chronolegal-frontend-smoke || true

      - name: Build nginx image (loaded locally)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: false
          load: true
          tags: chronolegal-nginx:build-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `nginx -t` validates the actual config this session rewrote (the new
      # upstream frontend block + proxy_pass in default.conf) against a real
      # nginx binary, rather than relying on it merely "looking right". nginx
      # resolves upstream server hostnames at config-load time even for `-t`,
      # so `backend`/`frontend` (only real inside the compose network) need
      # --add-host stand-ins here purely so the names resolve — nothing needs
      # to actually be listening for a syntax/config validation pass.
      - name: Validate nginx configuration syntax
        run: |
          docker run --rm \
            --add-host=backend:127.0.0.1 \
            --add-host=frontend:127.0.0.1 \
            chronolegal-nginx:build-check nginx -t

  # ── Docker runtime smoke test ───────────────────────────────────────────────
  # The job above only proves `docker build` succeeds — it never starts the
  # container, so a broken CMD, a startup-time crash (e.g. a real Postgres
  # connectivity failure in run_migrations(), which has no try/except), or
  # missing runtime env vars would pass CI and only surface at actual deploy
  # time. This job builds the real production image, boots it against real
  # Postgres/Redis service containers, and waits for /health to report
  # healthy — proving the container actually starts, migrates, and serves
  # traffic, not just that it builds. SKIP_MODEL_WARMUP=true is required
  # here (not part of the runtime behavior being tested, which is DB/Redis/
  # HTTP wiring) since the embedding model isn't pre-baked into the image
  # and lifespan blocks on warmup before serving /health.
  docker-runtime:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronolegal
          POSTGRES_PASSWORD: chronolegal
          POSTGRES_DB: chronolegal_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (loaded locally)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          load: true
          tags: chronolegal-backend:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend container
        run: |
          docker run -d --name chronolegal-backend-smoke \
            --network host \
            -e SECRET_KEY="ci-smoke-test-secret-key-not-for-production" \
            -e JWT_SECRET_KEY="ci-smoke-test-secret-key-not-for-production" \
            -e DATABASE_URL="postgresql+asyncpg://chronolegal:chronolegal@localhost:5432/chronolegal_smoke" \
            -e REDIS_URL="redis://localhost:6379/0" \
            -e SKIP_MODEL_WARMUP="true" \
            chronolegal-backend:smoke-test

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy within 60s"
          echo "--- container logs ---"
          docker logs chronolegal-backend-smoke
          exit 1

      - name: Verify health response content
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "$response"
          echo "$response" | grep -q '"status":"healthy"' || (echo "Unexpected health response" && exit 1)

      - name: Dump container logs
        if: always()
        run: docker logs chronolegal-backend-smoke || true

      - name: Tear down
        if: always()
        run: |
          docker stop chronolegal-backend-smoke || true
          docker rm chronolegal-backend-smoke || true

  # ── Docker Compose production stack smoke test ─────────────────────────────
  # The jobs above prove individual images build/boot in isolation. This one
  # actually runs the DOCUMENTED production entry point — the real compose
  # invocation from docs/deployment.md / Makefile's `make prod`
  # (`-f docker-compose.yml -f docker-compose.prod.yml --profile production`)
  # — with real postgres/redis/chromadb containers wired together exactly as
  # a real deployment would be. This is what actually caught (and now
  # verifies the fix for) the backend/frontend build.target bug and the
  # nginx static-file bind-mount that nothing populated. ollama is
  # intentionally excluded (GPU device reservation the runner doesn't have,
  # and no test here exercises live LLM inference — see docs/deployment.md's
  # LLM section for what that would require).
  docker-compose-prod-smoke:
    name: Docker Compose production stack smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env (non-default secrets — satisfies the production validator)
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=chronolegal_prod_smoke
          POSTGRES_USER=chronolegal_ci
          POSTGRES_PASSWORD=ci-prod-smoke-postgres-password-not-real
          REDIS_PASSWORD=ci-prod-smoke-redis-password-not-real
          SECRET_KEY=ci-prod-smoke-secret-key-not-for-production-use
          JWT_SECRET_KEY=ci-prod-smoke-jwt-secret-not-for-production-use
          LLM_PROVIDER=ollama
          SKIP_MODEL_WARMUP=true
          VITE_API_BASE_URL=http://localhost/api/v1
          VITE_WS_URL=ws://localhost/ws
          EOF

      # docker-compose.yml bind-mounts ./nginx/ssl:/etc/nginx/ssl:ro (added
      # this session, see docs/deployment.md's SSL section) so a real
      # deployment's certs actually reach the container. nginx/ssl/ is
      # gitignored and doesn't exist in this checkout, and Docker
      # auto-creates a missing bind-mount source as an empty host directory
      # — which would shadow the Dockerfile's baked-in placeholder cert with
      # nothing, and nginx fails to start with no cert to load. Generate the
      # same kind of throwaway self-signed cert docs/deployment.md's
      # "Option B" describes for exactly this situation.
      - name: Generate a throwaway self-signed cert for nginx/ssl
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/privkey.pem \
            -out nginx/ssl/fullchain.pem \
            -subj "/CN=ci-smoke-test.invalid"

      - name: Build and start the production stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile production up -d --build postgres redis chromadb backend frontend nginx

      - name: Wait for nginx to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' chronolegal-nginx 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "nginx healthy after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "nginx never became healthy within 180s"
          # nginx/nginx.conf logs to real files (/var/log/nginx/*.log), not
          # stdout/stderr, so `docker compose logs` never shows anything for
          # this container (unlike frontend's default nginx config, which
          # does symlink to stdout) — dump the healthcheck probe output and
          # the actual log files directly instead.
          echo "--- nginx health status ---"
          timeout 10 docker inspect --format='{{json .State.Health}}' chronolegal-nginx 2>&1 || true
          echo "--- nginx error.log ---"
          timeout 10 docker exec chronolegal-nginx cat /var/log/nginx/error.log 2>&1 || true
          echo "--- nginx access.log ---"
          timeout 10 docker exec chronolegal-nginx cat /var/log/nginx/access.log 2>&1 || true
          timeout 20 docker compose -f docker-compose.yml -f docker-compose.prod.yml ps || true
          timeout 30 docker compose -f docker-compose.yml -f docker-compose.prod.yml logs || true
          exit 1

      - name: Verify /health through nginx reports APP_ENV=production
        run: |
          response=$(curl -sf http://localhost/health)
          echo "$response"
          echo "$response" | grep -q '"environment":"production"' \
            || (echo "Backend did not report APP_ENV=production through nginx" && exit 1)

      - name: Verify Alembic is at head inside the running container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend \
            alembic current | tee /tmp/alembic-current.txt
          grep -q "0002 (head)" /tmp/alembic-current.txt \
            || (echo "Backend is not at the expected head revision" && exit 1)

      - name: Verify frontend is served through nginx
        run: |
          response=$(curl -sf http://localhost/)
          echo "$response" | grep -qi '<div id="root">' \
            || (echo "nginx did not proxy the frontend SPA correctly" && exit 1)

      - name: Auth smoke test through nginx (register, login, authenticated request, unauthorized/invalid rejection, refresh, logout revocation)
        run: |
          set -e
          BASE=http://localhost/api/v1
          EMAIL=ci-smoke@chronolegal.test
          PASSWORD=CiSmokeTest123

          curl -sf -X POST "$BASE/auth/register" -H "Content-Type: application/json" -d "$(jq -n \
            --arg email "$EMAIL" --arg pw "$PASSWORD" \
            '{email:$email, username:"ci_smoke_user", full_name:"CI Smoke Test", password:$pw}')" \
            | jq .

          login=$(curl -sf -X POST "$BASE/auth/login" -H "Content-Type: application/json" -d "$(jq -n \
            --arg email "$EMAIL" --arg pw "$PASSWORD" '{email:$email, password:$pw}')")
          access_token=$(echo "$login" | jq -r .access_token)
          refresh_token=$(echo "$login" | jq -r .refresh_token)
          [ -n "$access_token" ] && [ "$access_token" != "null" ] || (echo "No access token returned" && exit 1)
          [ -n "$refresh_token" ] && [ "$refresh_token" != "null" ] || (echo "No refresh token returned" && exit 1)

          me=$(curl -sf "$BASE/auth/me" -H "Authorization: Bearer $access_token")
          echo "$me" | jq -e ".email == \"$EMAIL\"" > /dev/null \
            || (echo "Authenticated /auth/me did not return the expected user" && exit 1)

          unauth_status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/auth/me")
          [ "$unauth_status" = "401" ] || (echo "Expected 401 without a token, got $unauth_status" && exit 1)

          invalid_status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/auth/me" -H "Authorization: Bearer not-a-real-token")
          [ "$invalid_status" = "401" ] || (echo "Expected 401 for an invalid token, got $invalid_status" && exit 1)

          refresh=$(curl -sf -X POST "$BASE/auth/refresh" -H "Content-Type: application/json" \
            -d "$(jq -n --arg rt "$refresh_token" '{refresh_token:$rt}')")
          new_refresh_token=$(echo "$refresh" | jq -r .refresh_token)
          [ -n "$(echo "$refresh" | jq -r .access_token)" ] || (echo "Refresh did not return a new access token" && exit 1)

          # Old refresh token was rotated out by the call above — it must now be rejected.
          reuse_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/auth/refresh" \
            -H "Content-Type: application/json" -d "$(jq -n --arg rt "$refresh_token" '{refresh_token:$rt}')")
          [ "$reuse_status" = "401" ] || (echo "Rotated-out refresh token was not rejected (got $reuse_status)" && exit 1)

          curl -sf -o /dev/null -w "%{http_code}\n" -X POST "$BASE/auth/logout" -H "Content-Type: application/json" \
            -d "$(jq -n --arg rt "$new_refresh_token" '{refresh_token:$rt}')"

          loggedout_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/auth/refresh" \
            -H "Content-Type: application/json" -d "$(jq -n --arg rt "$new_refresh_token" '{refresh_token:$rt}')")
          [ "$loggedout_status" = "401" ] || (echo "Refresh token was still valid after logout (got $loggedout_status)" && exit 1)

          echo "Auth smoke test passed: register, login, authenticated request, unauthorized/invalid-token rejection, refresh rotation, reused-token rejection, and logout revocation all verified through the real nginx -> backend -> postgres -> redis path."

      - name: Verify refresh-token revocation fails CLOSED when Redis is down
        run: |
          set -e
          BASE=http://localhost/api/v1

          login=$(curl -sf -X POST "$BASE/auth/login" -H "Content-Type: application/json" \
            -d '{"email": "ci-smoke@chronolegal.test", "password": "CiSmokeTest123"}')
          refresh_token=$(echo "$login" | jq -r .refresh_token)

          docker compose -f docker-compose.yml -f docker-compose.prod.yml stop redis
          sleep 2

          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/auth/refresh" \
            -H "Content-Type: application/json" -d "$(jq -n --arg rt "$refresh_token" '{refresh_token:$rt}')")
          echo "refresh status with Redis down: $status"
          [ "$status" = "401" ] || (echo "Refresh verification did not fail closed with Redis unreachable (got $status, expected 401)" && exit 1)

          docker compose -f docker-compose.yml -f docker-compose.prod.yml start redis

      - name: Verify backend recovers after a restart
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart backend
          for i in $(seq 1 30); do
            if curl -sf http://localhost/health > /dev/null 2>&1; then
              echo "Backend recovered after restart in $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not recover after restart within 60s"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backend
          exit 1

      - name: Dump stack logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans || true
          rm -f .env
          rm -rf nginx/ssl
