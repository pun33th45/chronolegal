name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend lint & test ────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronolegal
          POSTGRES_PASSWORD: chronolegal
          POSTGRES_DB: chronolegal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (black)
        run: black --check app/ tests/

      - name: Lint (isort)
        run: isort --check-only --profile black app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=100 --ignore=E203,W503

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://chronolegal:chronolegal@localhost:5432/chronolegal_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_PROVIDER: ollama
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Frontend lint & build ──────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_WS_BASE_URL: ws://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Docker build check ─────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker runtime smoke test ───────────────────────────────────────────────
  # The job above only proves `docker build` succeeds — it never starts the
  # container, so a broken CMD, a startup-time crash (e.g. a real Postgres
  # connectivity failure in run_migrations(), which has no try/except), or
  # missing runtime env vars would pass CI and only surface at actual deploy
  # time. This job builds the real production image, boots it against real
  # Postgres/Redis service containers, and waits for /health to report
  # healthy — proving the container actually starts, migrates, and serves
  # traffic, not just that it builds. SKIP_MODEL_WARMUP=true is required
  # here (not part of the runtime behavior being tested, which is DB/Redis/
  # HTTP wiring) since the embedding model isn't pre-baked into the image
  # and lifespan blocks on warmup before serving /health.
  docker-runtime:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronolegal
          POSTGRES_PASSWORD: chronolegal
          POSTGRES_DB: chronolegal_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (loaded locally)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          load: true
          tags: chronolegal-backend:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend container
        run: |
          docker run -d --name chronolegal-backend-smoke \
            --network host \
            -e SECRET_KEY="ci-smoke-test-secret-key-not-for-production" \
            -e JWT_SECRET_KEY="ci-smoke-test-secret-key-not-for-production" \
            -e DATABASE_URL="postgresql+asyncpg://chronolegal:chronolegal@localhost:5432/chronolegal_smoke" \
            -e REDIS_URL="redis://localhost:6379/0" \
            -e SKIP_MODEL_WARMUP="true" \
            chronolegal-backend:smoke-test

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became healthy within 60s"
          echo "--- container logs ---"
          docker logs chronolegal-backend-smoke
          exit 1

      - name: Verify health response content
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "$response"
          echo "$response" | grep -q '"status":"healthy"' || (echo "Unexpected health response" && exit 1)

      - name: Dump container logs
        if: always()
        run: docker logs chronolegal-backend-smoke || true

      - name: Tear down
        if: always()
        run: |
          docker stop chronolegal-backend-smoke || true
          docker rm chronolegal-backend-smoke || true
