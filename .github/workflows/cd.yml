name: CD — Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/chronolegal

jobs:
  # ── Build & push Docker images ─────────────────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ secrets.VITE_WS_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to server via SSH ───────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/chronolegal

            # Previously missing: this pulled new backend/frontend IMAGES but
            # never synced docker-compose.yml/docker-compose.prod.yml/nginx
            # config themselves, so any change to those files (e.g. the nginx
            # reverse-proxy rewrite, the SSL volume mount, healthcheck fixes)
            # would never reach a real server through this pipeline, only
            # backend/frontend source-code changes baked into the images
            # would. .env is untracked/gitignored, so a hard reset never
            # touches it.
            git fetch origin main
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps backend frontend nginx
            docker system prune -f --volumes=false

            # Previously missing: `up -d` returns once containers are
            # STARTED, not once they're actually healthy — a broken image
            # (e.g. a startup crash) would previously still report this whole
            # job as successful. Poll nginx's own /health (plain HTTP,
            # doesn't require the HTTPS redirect) and fail the deploy loudly
            # if the stack never comes up healthy, so a broken release is
            # visible as a failed GitHub Action instead of a silent outage.
            for i in $(seq 1 30); do
              if curl -sf http://localhost/health | grep -q '"status":"healthy"'; then
                echo "Deployment healthy after $((i * 2))s"
                echo "Deployed ${{ needs.build-and-push.outputs.version }}"
                exit 0
              fi
              sleep 2
            done
            echo "Deployment did not become healthy within 60s — see logs below"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200
            exit 1

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"
