# Render Blueprint — ChronoLegal BACKEND ONLY.
#
# The frontend is deployed separately on Vercel (frontend/vercel.json).
# docker-compose.yml / docker-compose.prod.yml remain the self-hosted path.
#
# Architecture (unchanged from local):
#   - FastAPI in Docker (backend/Dockerfile production stage), ONE process.
#   - Embedded Chroma (CHROMA_MODE=embedded) on a Render persistent disk, so
#     the vector index survives restarts and redeploys.
#   - LegalBERT embeddings + cross-encoder reranker, both baked into the
#     image at build time (no download on boot).
#   - Groq for LLM calls. The key lives only here, never in the frontend.
#   - Existing Supabase PostgreSQL (session pooler). No Redis.
#
# Why a paid plan: LegalBERT + reranker + torch need roughly 1–1.3GB RAM
# (free/starter instances have 512MB), and persistent disks are not
# available on the free plan. A disk also pins the service to a single
# instance, which is exactly what embedded Chroma requires.
#
# MANUAL STEPS after creating the service from this Blueprint:
#   1. Enter every `sync: false` value in the Render dashboard.
#      POSTGRES_* = Supabase "Session pooler" values (port 5432, IPv4), not
#      "Direct connection" (IPv6-only) or the transaction pooler (6543,
#      breaks asyncpg prepared statements).
#   2. Set CORS_ORIGINS to the exact Vercel URL (no trailing slash), plus
#      localhost for local development, e.g.
#        https://chronolegal.vercel.app,http://localhost:5173,http://127.0.0.1:5173
#   3. Seed the disk with the existing local index: copy the contents of
#      backend/chroma_data/ into /var/data/chroma (Render shell / scp), then
#      restart. If the disk is empty, startup re-embeds every case from
#      Supabase instead (slower, and uses the generic chunker).

services:
  - type: web
    name: chronolegal-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Never used to connect (no Redis is provisioned), but the production
      # secret check rejects the .env.example default.
      - key: REDIS_PASSWORD
        generateValue: true

      # Supabase PostgreSQL (session pooler)
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      # The defaults (10 + 20 overflow) exceed Supabase's pooler limits.
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"

      # Embedded Chroma on the persistent disk
      - key: CHROMA_MODE
        value: embedded
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/chroma

      # LegalBERT + reranker (pre-downloaded into HF_HOME by the Dockerfile)
      - key: EMBEDDING_PROVIDER
        value: legalbert
      - key: EMBEDDING_MODEL
        value: nlpaueb/legal-bert-base-uncased
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: SKIP_MODEL_WARMUP
        value: "false"

      # Groq
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: GROQ_API_KEY
        sync: false

      # CORS — exact Vercel origin + localhost for development (see step 2).
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
