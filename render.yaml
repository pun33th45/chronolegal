# Render Blueprint for the ChronoLegal FREE-TIER COLLEGE DEMO deployment.
#
# This is an ADDITIVE, demo-specific deployment path. It does not replace or
# modify docker-compose.yml / docker-compose.prod.yml, which remain the
# primary, fully-featured self-hosted deployment (see docs/deployment.md).
#
# Architecture (full reasoning in the accompanying investigation report):
#   - Backend: Docker web service, CHROMA_MODE=embedded (in-process Chroma,
#     no separate vector-DB service to pay for) and EMBEDDING_PROVIDER=openai
#     (calls OpenAI's embedding API instead of loading a ~1.3GB local model,
#     which would not fit a free-tier RAM ceiling).
#   - Frontend: static site build of the existing Vite app, unmodified.
#   - Database: Render's managed Postgres.
#   - Redis: intentionally NOT provisioned — see the report's Redis section
#     for the one disclosed trade-off this causes (refresh tokens stop
#     working past their natural expiry without it; login/access still work).
#
# Field names (env: docker / static, fromDatabase, generateValue, sync:
# false) match Render's Blueprint reference as of this writing — confirm
# against Render's current docs before running `render blueprint launch`,
# since that schema does evolve.
#
# REQUIRED MANUAL STEPS after connecting this repo in the Render dashboard:
#   1. Enter OPENAI_API_KEY in the Render dashboard (every `sync: false`
#      value below) — never put a real key in this file.
#   2. Once both services have their Render URLs, set CORS_ORIGINS below to
#      the frontend's exact URL, and VITE_API_BASE_URL to the backend's
#      exact URL (+ /api/v1), then redeploy both.
#   3. Run once, manually, against the new Render Postgres database:
#        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
#        CREATE EXTENSION IF NOT EXISTS "pg_trgm";
#        CREATE EXTENSION IF NOT EXISTS "btree_gin";
#      (Render's managed Postgres does not run this repo's
#      docker-entrypoint-initdb.d init script, which normally creates these.)
#   4. Then run `alembic upgrade head` once against that database (or trigger
#      it via the backend's own startup, which already calls run_migrations()).
#   5. UNVERIFIED — confirm whether Render Postgres requires an SSL query
#      param on the connection string for your plan/region; this blueprint
#      does not add one, since guessing wrong could break connectivity
#      rather than fix it.

databases:
  - name: chronolegal-db
    plan: free
    databaseName: chronolegal
    user: chronolegal_user

services:
  - type: web
    name: chronolegal-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Left as individual POSTGRES_* parts (not DATABASE_URL directly):
      # Settings.build_database_url() already assembles these into a
      # correctly-prefixed postgresql+asyncpg:// URL (see
      # backend/app/core/config.py) — Render's own connection string uses a
      # bare postgresql:// scheme, which asyncpg's SQLAlchemy dialect
      # rejects, so this avoids a broken URL without any code change.
      - key: POSTGRES_HOST
        fromDatabase:
          name: chronolegal-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: chronolegal-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: chronolegal-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: chronolegal-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chronolegal-db
          property: password
      - key: CHROMA_MODE
        value: embedded
      - key: CHROMA_PERSIST_DIRECTORY
        value: /tmp/chronolegal-chroma
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: "https://REPLACE-WITH-YOUR-FRONTEND-URL.onrender.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: SKIP_MODEL_WARMUP
        value: "false"

  - type: web
    name: chronolegal-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://REPLACE-WITH-YOUR-BACKEND-URL.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
