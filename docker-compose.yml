# =============================================================================
# ChronoLegal Platform - Docker Compose
# =============================================================================
#
# postgres/chromadb/redis/ollama/backend intentionally have no `ports:` here:
# every consumer that actually needs them (nginx, backend, each other) reaches
# them over the chronolegal-net bridge network by service name, which needs
# no published host port. Publishing them to the host unconditionally would
# expose a password-protected database/cache/vector-store/LLM server directly
# to whatever network the host's Docker daemon binds to (0.0.0.0 by default) —
# in production, that can mean the public internet, bypassing nginx/TLS
# entirely. docker-compose.override.yml (dev-only — never loaded for the
# documented production invocation, `-f docker-compose.yml -f
# docker-compose.prod.yml`) republishes them for local host-side tooling.

networks:
  chronolegal-net:
    driver: bridge

volumes:
  postgres_data:
  chromadb_data:
  redis_data:
  ollama_data:
  uploads_data:
  processed_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chronolegal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronolegal}
      POSTGRES_USER: ${POSTGRES_USER:-chronolegal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronolegal_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - chronolegal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronolegal_user} -d ${POSTGRES_DB:-chronolegal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ChromaDB Vector Database
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: chronolegal-chromadb
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - chronolegal-net
    # No healthcheck: confirmed via CI's docker-compose-prod-smoke job that
    # chromadb/chroma:latest is an extremely minimal Debian image (only
    # /usr/bin/sh — no bash, curl, wget, python3, or netcat), so no in-
    # container HTTP or TCP probe is possible without adding tooling via a
    # custom wrapper image. Both the original python3/urllib check and a
    # curl-based one (matching ollama/backend's pattern) failed with
    # "executable file not found in $PATH" — chromadb itself started and
    # served correctly both times; only the healthcheck command couldn't
    # run at all. See the matching depends_on: condition: service_started
    # below (chromadb isn't touched during backend's lifespan startup —
    # app/main.py — only lazily by search endpoints at request time).

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chronolegal-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chronolegal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama LLM Server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: chronolegal-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chronolegal-net
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: chronolegal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      CHROMA_HOST: chromadb
      REDIS_HOST: redis
      OLLAMA_HOST: ollama
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
      - processed_data:/data/processed
    networks:
      - chronolegal-net
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # React Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: chronolegal-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - chronolegal-net
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: chronolegal-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - chronolegal-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    profiles:
      - production
